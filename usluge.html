<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektro Burić | Usluge i kontakt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar with logo linking back to Home -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="Resursi/Logo2.png" alt="Logo">
                Elektro <span>Burić</span>
            </a>
        </div>
    </header>

    <main class="page-main">
        <div class="content-container">
            <section class="form-section-integrated">
                <h2>Usluge i kontakt</h2>
                <p class="subtitle">Trebate elektroinstalaterske usluge? Pošaljite nam upit i kontaktirat ćemo vas u najkraćem roku.</p>
                
                <form id="service-form" action="https://formspree.io/f/your-form-id" method="POST">
                    <div class="form-group">
                        <label for="name">Ime i prezime / Naziv tvrtke</label>
                        <input type="text" id="name" name="name" required placeholder="npr. Ivan Horvat">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email adresa</label>
                        <input type="email" id="email" name="email" required placeholder="ivan@example.com">
                    </div>

                    <div class="form-group">
                        <label for="phone">Broj telefona</label>
                        <input type="tel" id="phone" name="phone" placeholder="npr. 098 123 4567">
                    </div>

                    <div class="form-group">
                        <label for="message">Opis posla / Usluge</label>
                        <textarea id="message" name="message" rows="5" placeholder="Opišite kakve vam elektroinstalacije ili radovi trebaju..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary full-width">Pošalji upit</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Elektro Burić, Obrt za elektroinstalacije. <br> Vlasnik: Franko Burić</p>
        </div>
    </footer>

</body>
</html>
