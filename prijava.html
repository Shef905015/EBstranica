<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elektro Burić | Prijava za posao</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navbar with logo linking back to Home -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html">
                <img src="Resursi/Logo2.png" alt="Logo">
                Elektro <span>Burić</span>
            </a>
        </div>
    </header>

    <main class="page-main">
        <div class="content-container">
            <section class="form-section-integrated">
                <h2>Pridruži se našem timu</h2>
                <p class="subtitle">Ispunite prijavu ispod i pošaljite nam svoje podatke.</p>
                
                <form id="application-form" action="https://formspree.io/f/your-form-id" method="POST">
                    <div class="form-group">
                        <label for="name">Ime i prezime</label>
                        <input type="text" id="name" name="name" required placeholder="npr. Ivan Horvat">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email adresa</label>
                        <input type="email" id="email" name="email" required placeholder="ivan@example.com">
                    </div>

                    <div class="form-group">
                        <label for="experience">Iskustvo / Znanje</label>
                        <textarea id="experience" name="experience" rows="5" placeholder="Kratko opišite vaše dosadašnje iskustvo..."></textarea>
                    </div>

                    <button type="submit" class="btn-primary full-width">Pošalji prijavu</button>
                </form>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-content">
            <p>&copy; 2026 Elektro Burić, Obrt za elektroinstalacije. <br> Vlasnik: Franko Burić</p>
        </div>
    </footer>

</body>
</html>
